[workspace]

[package]
name = "sotf-capture"
version = "0.5.2"
edition = "2024"
license = "GPL-3.0-or-later"
authors = ["Pierre F. Aubert pierre@spinorama.org"]
description = "Acoustic measurement capture: swept-sine recording, clock correction, and session handoff"
repository = "https://github.com/pierreaubert/sotf-capture"
keywords = ["audio", "dsp", "measurement"]
categories = ["multimedia::audio"]

[dependencies]
autoeq = { version = ">=0.5.54", path = "../autoeq" }
math-dsp = { version = "0.5", path = "../math-audio/crates/math-dsp" }
# Private rubato 5.0.0 fork (exact variable-ratio sizing, prepared cutoff
# tables), shared from math-audio so offline reference resampling matches the
# engine's resampler parameters. A sibling math-audio checkout is required.
rubato = { version = "5.0.0",  package = "sotf-rubato",  git = "https://github.com/pierreaubert/sotf-3rdparties" }
audioadapter-buffers = "5"
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
sha2 = "0.11"
hound = "3.5"
log = "0.4.28"
tempfile = "3.23"
rustfft = "6.4"
rtrb = "0.4"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2.0.17"
math-rir = { version = "0.5", path = "../math-audio/crates/math-rir" }
# Cross-platform audio I/O (CoreAudio/RemoteIO backend on iOS). The iOS app
# must still configure AVAudioSession (category, mic permission) — see README.md §iOS.
# Optional so tvOS (no cpal backend: mach2 refuses tvOS) builds DSP-only
# with `--no-default-features`; see README.md §tvOS.
cpal = { version = "0.17", optional = true }

# CLI-only: the binary is skipped without `capture-io`, and tvOS ships no
# CLI (ctrlc's nix backend needs fork/exec, absent from tvOS libc).
[target.'cfg(not(target_os = "tvos"))'.dependencies]
clap = { version = "4.5", features = ["derive"] }
ctrlc = { version = "3.5", features = ["termination"] }
env_logger = "0.11"

[[bin]]
name = "sotf-capture"
path = "src/bin/sotf_capture.rs"
required-features = ["capture-io"]

[[test]]
name = "emulated_capture"
path = "tests/emulated_capture.rs"
required-features = ["test-util"]

[features]
# Default keeps the full capture path (device I/O, playback, recording).
default = ["capture-io"]
# Hardware audio I/O via cpal. Off on tvOS, where cpal has no backend.
capture-io = ["dep:cpal"]
# Windows ASIO device support (additive; desktop-only, off by default).
asio = ["capture-io", "cpal/asio"]
# Emulated audio backends for hardware-free tests (never enable in production).
test-util = []

# SOTF owned maintenance forks; upstream 2.1.1, local version 2.1.2.

# Match GPUI compatibility forks: workspace patches are not inherited.


[lints.rust]
ambiguous_negative_literals = "warn"
missing_debug_implementations = "warn"
redundant_imports = "warn"
redundant_lifetimes = "warn"
trivial_numeric_casts = "warn"
unsafe_op_in_unsafe_fn = "warn"
unused_lifetimes = "warn"

[lints.clippy]
cargo = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
correctness = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }
# Transitive dependency versions are selected by upstream crates.
multiple_crate_versions = "allow"

[patch.crates-io]
# Retained SOTF fix for the uninhabited Objective-C runtime static. Pin the
# compatibility revision that preserves the upstream `block` package name.
block = { git = "https://github.com/pierreaubert/sotf-3rdparties", rev = "5a4634af0916b5f53effa5ef6340efd90af32285" }
