[workspace]

[package]
name = "sotf-capture"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
authors = ["Pierre F. Aubert pierre@spinorama.org"]
description = "Acoustic measurement capture: swept-sine recording, clock correction, and session handoff"
repository = "https://github.com/pierreaubert/sotf-capture"
keywords = ["audio", "dsp", "measurement"]
categories = ["multimedia::audio"]

[dependencies]
autoeq = { version = ">=0.5.54", path = "../autoeq" }
math-dsp = { version = "0.5", path = "../math-audio/crates/math-dsp" }
# Private rubato 5.0.0 fork (exact variable-ratio sizing, prepared cutoff
# tables), shared from math-audio so offline reference resampling matches the
# engine's resampler parameters. A sibling math-audio checkout is required.
rubato = { path = "../sotf-3rdparties/rubato" }
audioadapter-buffers = "5"
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
sha2 = "0.11"
hound = "3.5"
log = "0.4.28"
tempfile = "3.23"
rustfft = "6.4"
rtrb = "0.4"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2.0.17"
math-rir = { version = "0.5", path = "../math-audio/crates/math-rir" }
clap = { version = "4.5", features = ["derive"] }
ctrlc = { version = "3.5", features = ["termination"] }
env_logger = "0.11"

[[bin]]
name = "sotf-capture"
path = "src/bin/sotf_capture.rs"

# Platform-specific: the full device/playback path is desktop-only (iOS uses
# the devices stub and compiles no capture I/O), mirroring sotf-engine.
[target.'cfg(not(target_os = "ios"))'.dependencies]
cpal = "0.17"

[features]
# Windows ASIO device support (additive; off by default).
asio = ["cpal/asio"]

[patch.crates-io]
# SOTF owned maintenance forks; upstream 2.1.1, local version 2.1.2.
derive_more = { path = "../sotf-3rdparties/derive_more" }
derive_more-impl = { path = "../sotf-3rdparties/derive_more-impl" }

# Match GPUI compatibility forks: workspace patches are not inherited.
fontconfig-parser = { path = "../sotf-3rdparties/fontconfig-parser" }
psm = { path = "../sotf-3rdparties/stacker/psm" }
nalgebra = { path = "../sotf-3rdparties/nalgebra" }
block = { path = "../sotf-3rdparties/block" }
objc = { path = "../sotf-3rdparties/objc" }
async-task = { path = "../sotf-3rdparties/async-task" }
coreaudio-rs = { path = "../sotf-3rdparties/coreaudio-rs" }

[patch."https://github.com/zed-industries/font-kit"]
zed-font-kit = { path = "../sotf-3rdparties/zed-font-kit" }

[lints.clippy]
perf = { level = "warn", priority = -1 }
